{%- assign bulan = "Januari,Februari,Mac,April,Mei,Jun,Julai,Ogos,September,Oktober,November,Disember" | split: "," -%}
{%- assign m = include.d | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.d | date: '%Y-%m-%d' }}">{{ include.d | date: "%-d" }} {{ bulan[m] }} {{ include.d | date: "%Y" }}</time>
